name: Docker build and push
# Pushes to `DOCKER_IMAGE` (repo variable), e.g. shurikan117/tao-umbrel, when GitHub owner != Hub namespace.

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: "Docker Hub image (e.g. myuser/tao-umbrel). Leave empty to use DOCKER_IMAGE repo variable or <owner>/tao-umbrel."
        required: false
        type: string
        default: ""
      version_tag:
        description: "Image tag (e.g. 1.7.3)"
        required: true
        type: string
        default: "1.7.3"
      push_latest:
        description: "Also push :latest pointing at this build"
        required: false
        type: boolean
        default: true

  # Branch: validate CI on dev without merging to default branch.
  # Tag: semver releases remain v*-prefixed.
  push:
    branches:
      - dev
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docker-compose*.yml"
      - "scripts/**"
      - ".github/workflows/docker-publish.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # Use Node 24 for JS-based actions (checkout, docker/*) per GitHub deprecation timeline.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DOCKER_IMAGE_REPO_VAR: ${{ vars.DOCKER_IMAGE }}
      REF_TYPE_EVENT: ${{ github.ref_type }}
      EVENT_INPUT_IMAGE: ${{ github.event.inputs.docker_image || '' }}
      EVENT_INPUT_VERSION: ${{ github.event.inputs.version_tag || '' }}
      EVENT_INPUT_LATEST: ${{ github.event.inputs.push_latest || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image name and tags
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            IMAGE_RAW="${EVENT_INPUT_IMAGE:-}"
            VERSION="${EVENT_INPUT_VERSION:-}"
            PUSH_LATEST="${EVENT_INPUT_LATEST:-true}"
            case "$PUSH_LATEST" in
              '' | false | False | FALSE | 0 ) PUSH_LATEST="false" ;;
              * ) PUSH_LATEST="true" ;;
            esac
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            IMAGE_RAW=""
            if [ "${REF_TYPE_EVENT:-}" = "tag" ]; then
              VERSION="${GITHUB_REF_NAME#v}"
              PUSH_LATEST="true"
            elif [ "${REF_TYPE_EVENT:-}" = "branch" ]; then
              VERSION="dev"
              PUSH_LATEST="false"
            else
              echo "ERROR: Unexpected ref type for push: ${REF_TYPE_EVENT:-unset}"
              exit 1
            fi
          else
            echo "ERROR: Unexpected event: ${GITHUB_EVENT_NAME}"
            exit 1
          fi

          IMAGE_RAW="${IMAGE_RAW// }"

          if [ -z "$IMAGE_RAW" ]; then
            if [ -n "${DOCKER_IMAGE_REPO_VAR:-}" ]; then
              IMAGE="${DOCKER_IMAGE_REPO_VAR}"
            else
              IMAGE="${GITHUB_REPOSITORY_OWNER}/tao-umbrel"
            fi
          else
            IMAGE="$IMAGE_RAW"
          fi

          # OCI/Docker repository names must be lowercase (e.g. github.com/JDsnyke -> jdsnyke/...).
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"

          TAGS="${IMAGE}:${VERSION}"
          if [ "${REF_TYPE_EVENT:-}" = "branch" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            DEV_SHA="${GITHUB_SHA:0:7}"
            TAGS="${TAGS},${IMAGE}:dev-${DEV_SHA}"
          fi
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          echo "Computed tags (CSV): ${TAGS}"

          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

          # Branch `dev` builds use image tag `dev` (moving); use Dockerfile UMBREL_VERSION for git clone (not `dev`).
          first_umbrel_default="$(grep -m1 '^ARG UMBREL_VERSION=' Dockerfile | cut -d= -f2- || true)"
          if [ "${VERSION}" = "dev" ] || [[ "${VERSION}" == dev-* ]]; then
            umbrel_for_build="${first_umbrel_default}"
          else
            umbrel_for_build="${VERSION}"
          fi
          echo "umbrel_version_build=${umbrel_for_build}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            UMBREL_VERSION=${{ steps.meta.outputs.umbrel_version_build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
