# Optional: full umbrelOS-style host parity (privileged, host network, device mounts).
# Merge with the default minimal compose, e.g.:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.full-host.example.yml docker compose up -d
# Or copy this file to docker-compose.full-host.yml and reference that name in COMPOSE_FILE.
# When `network_mode: host` is active, published ports from the base compose are ignored at runtime.

services:
  umbrel:
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys
      - /lib/modules:/lib/modules:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
